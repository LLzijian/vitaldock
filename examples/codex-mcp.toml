# Replace command with the absolute Python path in your own VitalDock environment.
# Add this table to your Codex config; retain your other settings.
[mcp_servers.vitaldock_live]
command = "C:/path/to/vitaldock/.venv/Scripts/python.exe"
args = ["-m", "vitaldock", "mcp-live", "--wellness"]
startup_timeout_sec = 20
tool_timeout_sec = 90
enabled_tools = ["connection_status", "recent_activities", "wellness_context", "running_context"]
