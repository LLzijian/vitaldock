[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitaldock"
version = "0.2.0"
description = "Fresh running and recovery context for personal agents. Huawei first."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lyu Zi-Jian"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
live = ["keyring>=25,<26"]
dev = ["ruff>=0.14,<1"]

[project.scripts]
vitaldock = "vitaldock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
